<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MedFlow — hospital management system" />
    <title>MedFlow</title>
    <script>
      // Apply the last appearance (mode, colors, density) before the first
      // paint — no flash of the default look. Written by ThemeProvider.
      (function () {
        try {
          var root = document.documentElement;
          var snapshot = JSON.parse(localStorage.getItem("medflow-appearance") || "null");
          var mode =
            (snapshot && snapshot.appearance.mode) ||
            localStorage.getItem("medflow-theme") ||
            "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          // Sidebar side, written by Sidebar (the splash screen follows it)
          if (localStorage.getItem("medflow-sidebar-position") === "right")
            root.setAttribute("data-sidebar", "right");
          if (!snapshot) return;
          root.setAttribute("data-density", snapshot.appearance.density);
          var vars = snapshot.vars[dark ? "dark" : "light"];
          for (var name in vars) root.style.setProperty(name, vars[name]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
